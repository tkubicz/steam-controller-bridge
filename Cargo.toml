[workspace]
resolver = "2"
members = [
    "crates/gamepad-state",
    "crates/bridge-protocol",
    "crates/bridge-output",
    "crates/bridge-core",
    "crates/controller-mapper",
    "crates/recording",
    "crates/steam-controller-device",
    "crates/steam-controller-protocol",
    "apps/gamepad-simulator",
    "apps/sc-replay",
    "apps/sc-probe",
    "apps/sc-visualizer",
    "apps/sc-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lynxware/steam-controller-bridge"

[workspace.dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hidapi = { version = "2.6.6", default-features = false, features = ["macos-shared-device"] }
rustix = { version = "1.1.4", features = ["fs"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serialport = { version = "4.9.0", default-features = false }
ctrlc = "3.5.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
