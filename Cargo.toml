[workspace]
resolver = "2"
members = [
    "crates/gamepad-state",
    "crates/macos-power-monitor",
    "crates/bridge-protocol",
    "crates/bridge-output",
    "crates/bridge-core",
    "crates/bridge-runtime",
    "crates/controller-art",
    "crates/controller-mapper",
    "crates/desktop-bindings",
    "crates/profile-picker",
    "crates/recording",
    "crates/release-updater",
    "crates/steam-controller-discovery",
    "crates/steam-controller-device",
    "crates/steam-controller-protocol",
    "crates/ui-theme",
    "apps/gamepad-simulator",
    "apps/sc-replay",
    "apps/sc-probe",
    "apps/sc-visualizer",
    "apps/sc-bridge",
    "apps/sc-bridge-menu",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tkubicz/steam-controller-bridge"

# No crate here goes to crates.io. Each member sets `publish = false` directly
# rather than inheriting it, so the intent is readable in the file you are
# looking at. A new member that forgets it fails `cargo deny check bans`, which
# rejects version-less path dependencies for a publishable crate.

[workspace.dependencies]
base64 = "0.23.0"
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
semver = { version = "1.0.27", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hidapi = { version = "2.6.6", default-features = false, features = ["macos-shared-device"] }
rustix = { version = "1.1.4", features = ["fs"] }
rfd = "0.17.2"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.24.2"
tiny-skia = { version = "0.12.0", default-features = false, features = ["simd", "std"] }
winit = "0.30.13"
serialport = { version = "4.9.0", default-features = false }
ctrlc = "3.5.2"
enigo = { version = "0.6.1", features = ["platform_specific"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "hidsystem", "libc", "pwr_mgt"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "libc",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
