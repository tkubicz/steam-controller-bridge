name: CI

on:
  # Branch pushes are already covered by `pull_request`, so listening to every
  # push ran the whole matrix twice for one commit.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# One run per pull request: a new push, or an edit to the title or description,
# supersedes the run it replaces. Runs on `main` are never cancelled, and a
# `workflow_dispatch` run groups by ref rather than pull request, so the release
# branch's explicitly dispatched run stands on its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the title validator
        run: python3 tools/check-pr-title.py --self-test
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check-pr-title.py "${PR_TITLE}"

  test:
    # macOS is the shipped product target. Ubuntu is intentionally retained as
    # a portability gate for shared crates and non-macOS stubs; passing it does
    # not claim that the live bridge or menu application supports Linux.
    strategy:
      # Never let one platform's failure hide the other platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Check product version invariant
        run: |
          python3 tools/check-workspace-versions.py --self-test
          python3 tools/check-workspace-versions.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-targets

  deny:
    # Advisories, licences, banned crates, and source registries. The graph is
    # scoped to macOS in deny.toml because that is what this project ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  firmware-tests:
    # Host-native parser/session tests. No Arduino toolchain required, so this
    # stays cheap and covers both GCC and Clang under -Werror.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run native firmware tests
        run: make -C firmware/xiao-nrf52840 test

  firmware-artifacts:
    # macOS only: the pinned Seeed nRF52 core bundles adafruit-nrfutil for
    # macOS and Windows, but on Linux its recipe falls back to a bare PATH
    # lookup that nothing satisfies, so the DFU/UF2 build cannot run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - name: Install pinned Seeed nRF52 core
        run: make -C firmware/xiao-nrf52840 setup
      - name: Build UF2 and DFU artifacts
        run: make -C firmware/xiao-nrf52840 artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xiao-nrf52840-firmware
          path: firmware/xiao-nrf52840/build/artifacts/

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build and ad-hoc sign menu-bar application
        run: ./tools/build-macos-app.sh
      - name: Archive application bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Steam Controller Bridge.app" steam-controller-bridge-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: steam-controller-bridge-macos
          path: steam-controller-bridge-macos.zip
