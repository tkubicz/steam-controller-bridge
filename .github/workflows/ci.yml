name: CI

on:
  # Branch pushes are already covered by `pull_request`, so listening to every
  # push ran the whole matrix twice for one commit.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# One run per pull request: a new push, or an edit to the title or description,
# supersedes the run it replaces. Runs on `main` are never cancelled, and a
# `workflow_dispatch` runs group by ref rather than pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the title validator
        run: python3 tools/check-pr-title.py --self-test
      - name: Check newest generated changelog section
        run: |
          python3 tools/check-changelog.py --self-test
          python3 tools/check-changelog.py
      - name: Validate pull-request release metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check-pr-title.py "${PR_TITLE}" --body "${PR_BODY}"

  test:
    # macOS is the shipped product target. Ubuntu is intentionally retained as
    # a portability gate and now builds the Linux controller-HID provider;
    # passing it does not claim that the complete bridge or menu supports Linux.
    strategy:
      # Never let one platform's failure hide the other platform's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux HID build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - name: Verify Linux controller access rule
        if: runner.os == 'Linux'
        run: |
          for rule in "${GITHUB_WORKSPACE}"/packaging/linux/*.rules; do
            udevadm verify "${rule}"
          done
      - name: Check Python tool invariants
        run: |
          python3 tools/check-portable-core.py --self-test
          python3 tools/check-portable-core.py
          python3 tools/check-linux-udev-rules.py --self-test
          python3 tools/check-linux-udev-rules.py
          python3 tools/check-workspace-versions.py --self-test
          python3 tools/check-workspace-versions.py
          python3 tools/build-macos-app.py --self-test
          python3 tools/check-firmware-artifact.py --self-test
          python3 tools/prepare-local-update.py --self-test
      - run: cargo fmt --all --check
      # Default features are the distributed configuration: local filesystem
      # updates are absent, so this is the code users receive.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Unlike a workspace-wide --all-features run, this exact invocation proves
      # the menu feature forwards into the macOS-only updater dependency.
      - if: runner.os == 'macOS'
        run: cargo check -p sc-bridge-menu --features local-update-source
      # Only these packages differ when the local update source is enabled.
      - run: cargo clippy -p release-updater -p sc-bridge-menu --all-targets --all-features -- -D warnings
      - run: cargo test -p release-updater -p sc-bridge-menu --all-features
      - run: cargo build --workspace --all-targets

  deny:
    # Audit the shipped macOS graph and the early Linux controller-HID provider
    # without pulling the unshipped Linux GUI stack into either graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit shipped macOS dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - name: Audit Linux controller HID dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: crates/steam-controller-device/Cargo.toml
          arguments: >-
            --all-features
            --target x86_64-unknown-linux-gnu

  firmware-tests:
    # Host-native parser/session tests. No Arduino toolchain required, so this
    # stays cheap and covers both GCC and Clang under -Werror.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run native firmware tests
        run: make -C firmware/xiao-nrf52840 test

  firmware-artifacts:
    # macOS only: the pinned Seeed nRF52 core bundles adafruit-nrfutil for
    # macOS and Windows, but on Linux its recipe falls back to a bare PATH
    # lookup that nothing satisfies, so the DFU/UF2 build cannot run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - name: Install pinned Seeed nRF52 core
        run: make -C firmware/xiao-nrf52840 setup
      - name: Build and validate firmware artifacts
        run: make -C firmware/xiao-nrf52840 artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xiao-nrf52840-firmware
          path: firmware/xiao-nrf52840/build/artifacts/

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build and ad-hoc sign menu-bar application
        run: ./tools/build-macos-app.py
      - name: Archive application bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Steam Controller Bridge.app" steam-controller-bridge-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: steam-controller-bridge-macos
          path: steam-controller-bridge-macos.zip
