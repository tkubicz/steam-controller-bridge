name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  commit-subjects:
    # CI validates the pull-request title, but nothing validated the message
    # that actually landed. A squash whose subject is not a Conventional Commit
    # is invisible to Release Please: no changelog entry, no version bump, and
    # no failure anywhere. Checking it here turns that silence into a red run.
    #
    # This deliberately does not gate the jobs below. Blocking them would stop
    # Release Please from updating the release pull request, which is where an
    # inaccurate entry gets corrected in the first place.
    name: Commit subjects
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Check out enough history to inspect the push
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate every subject that landed on the branch
        env:
          PUSHED_BEFORE: ${{ github.event.before }}
          PUSHED_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${PUSHED_BEFORE}" =~ ^0+$ ]]; then
            range="${PUSHED_AFTER}~1..${PUSHED_AFTER}"
          else
            range="${PUSHED_BEFORE}..${PUSHED_AFTER}"
          fi
          invalid=0
          while read -r sha; do
            # Merge commits carry GitHub's wording, not a contributor's.
            if [[ "$(git rev-list --parents -n 1 "${sha}" | wc -w)" -gt 2 ]]; then
              continue
            fi
            subject="$(git log -1 --format=%s "${sha}")"
            if ! python3 tools/check-pr-title.py "${subject}"; then
              echo "::error::${sha} landed as '${subject}', which Release Please cannot read. Correct the pull-request metadata and rerun the Release workflow."
              invalid=1
            fi
          done < <(git rev-list "${range}")
          exit "${invalid}"

  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      # GitHub refuses to start workflows for events triggered by GITHUB_TOKEN,
      # so a release pull request raised with it never runs CI. An app token is
      # a real identity, so the release pull request behaves like any other:
      # CI starts on push, with nothing to approve by hand.
      - name: Mint a token for the release pull request
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The app token owns the checkout too: the lockfile commit below is
      # pushed with these credentials, and a push made with GITHUB_TOKEN would
      # be blocked from starting CI in the same way.
      - name: Check out the target branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main

      # Release Please updates the workspace versions but not Cargo.lock, so
      # the release branch would otherwise carry a lockfile that disagrees with
      # them. CI starts by itself once this lands on the branch.
      - name: Update Cargo.lock on the release branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.headBranchName // empty' <<<"${RELEASE_PR}")
          if [[ -z "${branch}" ]]; then
            echo "Release Please did not return a release-PR branch" >&2
            exit 1
          fi
          git fetch origin "${branch}"
          git checkout --detach FETCH_HEAD
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock for release"
            git push origin "HEAD:${branch}"
          fi

  validate:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2

  firmware:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    # The pinned Seeed core bundles adafruit-nrfutil for macOS and Windows. Its
    # Linux recipe instead expects an unavailable executable on PATH.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install pinned Seeed nRF52 core
        run: make -C firmware/xiao-nrf52840 setup
      - name: Run native firmware tests
        run: make -C firmware/xiao-nrf52840 test
      - name: Build UF2 and DFU artifacts
        run: make -C firmware/xiao-nrf52840 artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/xiao-nrf52840/build/artifacts/

  macos-app:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and ad-hoc sign menu-bar application
        env:
          # Public verification keys are safe repository/environment variables.
          # Use key-id=base64;next-key=base64 during staged rotation.
          SC_BRIDGE_UPDATE_PUBLIC_KEYS: ${{ vars.UPDATE_SIGNING_PUBLIC_KEYS }}
          SC_BRIDGE_UPDATE_PUBLIC_KEY_B64: ${{ vars.UPDATE_SIGNING_PRIMARY_PUBLIC_KEY_B64 }}
          UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${SC_BRIDGE_UPDATE_PUBLIC_KEYS}"
          test -n "${SC_BRIDGE_UPDATE_PUBLIC_KEY_B64}"
          test -n "${UPDATE_SIGNING_KEY_ID}"
          case ";${SC_BRIDGE_UPDATE_PUBLIC_KEYS};" in
            *";${UPDATE_SIGNING_KEY_ID}=${SC_BRIDGE_UPDATE_PUBLIC_KEY_B64};"*) ;;
            *) echo "primary signing key is not embedded in the application" >&2; exit 1 ;;
          esac
          ./tools/build-macos-app.sh
      - name: Archive application bundle
        run: |
          set -euo pipefail
          /usr/bin/codesign --verify --deep --strict "dist/Steam Controller Bridge.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Steam Controller Bridge.app" steam-controller-bridge-macos.zip
          mkdir archive-check
          ditto -x -k steam-controller-bridge-macos.zip archive-check
          test "$(find archive-check -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')" = 1
          /usr/bin/codesign --verify --deep --strict "archive-check/Steam Controller Bridge.app"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: steam-controller-bridge-macos.zip

  publish:
    needs: [release_please, validate, firmware, macos-app]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Protect this environment with required reviewers and limit its secrets to
    # this job. Missing or mismatched key material fails before upload.
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/firmware/steam-controller-bridge-xiao-nrf52840.uf2 release/
          mv artifacts/firmware/steam-controller-bridge-xiao-nrf52840-dfu.zip release/
          mv artifacts/macos-app/steam-controller-bridge-macos.zip release/
      - name: Generate and sign unified update manifest
        env:
          RELEASE_BODY: ${{ needs.release_please.outputs.release_body }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          SC_BRIDGE_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          SC_BRIDGE_UPDATE_PUBLIC_KEY_B64: ${{ vars.UPDATE_SIGNING_PRIMARY_PUBLIC_KEY_B64 }}
          SC_BRIDGE_UPDATE_ADDITIONAL_PRIVATE_KEYS: ${{ secrets.UPDATE_SIGNING_ADDITIONAL_PRIVATE_KEYS }}
          UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${SC_BRIDGE_UPDATE_PRIVATE_KEY_B64}"
          test -n "${SC_BRIDGE_UPDATE_PUBLIC_KEY_B64}"
          test -n "${UPDATE_SIGNING_KEY_ID}"
          printf '%s\n' "${RELEASE_BODY}" > release-notes.md
          cargo run --locked -p release-updater --bin release-manifest -- \
            --release-tag "${RELEASE_TAG}" \
            --version "$(tr -d '[:space:]' < version.txt)" \
            --release-notes release-notes.md \
            --application release/steam-controller-bridge-macos.zip \
            --firmware release/steam-controller-bridge-xiao-nrf52840.uf2 \
            --firmware-header firmware/xiao-nrf52840/src/firmware_version.h \
            --output release \
            --key-id "${UPDATE_SIGNING_KEY_ID}"
      - name: Checksum every release asset
        run: |
          set -euo pipefail
          cd release
          sha256sum steam-controller-bridge-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Verify the generated draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ needs.release_please.outputs.release_body }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json body,isDraft > release-metadata.json
          python3 - <<'PY'
          import json
          import os

          with open("release-metadata.json", encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          if not metadata["isDraft"]:
              raise SystemExit("refusing to upload to a release that is already public")
          if metadata["body"].rstrip() != os.environ["RELEASE_BODY"].rstrip():
              raise SystemExit("GitHub release body differs from generated CHANGELOG notes")
          PY
      - name: Upload artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --clobber release/*
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --draft=false --latest
