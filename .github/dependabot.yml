version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # Raise Cargo.toml minimum versions even when Cargo.lock updates are compatible.
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
