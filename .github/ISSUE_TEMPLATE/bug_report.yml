name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest affected area.
      options:
        - Bridge or controller input
        - XIAO firmware or flashing
        - Menu app, profiles, or permissions
        - Application updater or packaging
        - Visualizer or developer tool
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence and whether it happens every time.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **For controller or bridge failures only:** confirm the device is a
        Steam Controller 2 (2026), fully quit Steam, stop other controller
        tools, and state whether the connection is the official Puck or direct
        Bluetooth. Direct USB-C input and the 2015 Steam Controller are not
        supported. These steps are not prerequisites for updater, packaging,
        UI, or documentation reports.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (when applicable)
      description: >
        For runtime or hardware issues, paste Copy Diagnostics or CLI status
        output. Displayed hardware serials are masked. Do not paste sc-probe
        captures or recording files because they retain full serials.
      render: text

  - type: input
    id: versions
    attributes:
      label: Version and environment
      description: Release tag or commit, macOS version, and relevant tool or browser version.
      placeholder: "v1.5.0 on macOS 15.5"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware revision (hardware issues only)
      description: Copy the connected revision shown by the menu app, or name the release artifact flashed.
      placeholder: "Revision 2 from release v1.5.0"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, logs, or details that help distinguish the failure.
