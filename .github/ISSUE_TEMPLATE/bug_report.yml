name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The two checkboxes below cover the most common
        causes — please confirm both before filling in the rest.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before reporting
      options:
        - label: >
            My controller is a **Steam Controller 2 (2026)**, not the
            discontinued 2015 Steam Controller. The 2015 controller and its
            wireless receiver use a different protocol and are not supported.
          required: true
        - label: >
            Steam is **fully quit** (Steam → Quit Steam, not just closing the
            window) and its helper is stopped with
            `launchctl bootout user/$(id -u)/com.valvesoftware.steam.ipctool`.
          required: true
        - label: >
            No other controller tool, `sc-probe`, or `sc-visualizer` is running
            against the same collection.
          required: true

  - type: dropdown
    id: transport
    attributes:
      label: How is the controller connected?
      options:
        - Official Puck over USB
        - Direct Bluetooth
        - Direct USB-C (unsupported)
        - Not connected / not detected
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        In the menu-bar app, use **Copy Diagnostics** and paste the result. From
        the CLI, paste the `sc-bridge` status lines instead. Hardware serials are
        masked to their last four characters, so this output is safe to share.
        Do not paste `sc-probe capture` files — those keep full serials so they
        stay replayable.
      render: text
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Release tag or commit, plus your macOS version.
      placeholder: "v0.1.0, macOS 15.5"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: >
        Which UF2 or DFU build is on the XIAO? Rumble needs firmware containing
        protocol-v1 message type 8; older builds accept input but cannot return
        vibration requests.
      placeholder: "v0.1.0 UF2 from Releases"
