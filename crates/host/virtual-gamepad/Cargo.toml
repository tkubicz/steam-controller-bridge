[package]
name = "virtual-gamepad"
version = "1.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bridge-output = { path = "../../bridge/bridge-output" }
gamepad-state = { path = "../../bridge/gamepad-state" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFBundle", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { workspace = true, features = ["block2", "dispatch2", "hid"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdevil.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "deny"
