[package]
name = "ui-theme"
version = "1.5.0"
edition.workspace = true
license.workspace = true
# Not published to crates.io; distribution is GitHub releases only.
publish = false

[dependencies]
# Depends on eframe rather than egui directly so the egui version is whatever
# eframe pulls in. A separate egui entry could drift and give the apps two
# incompatible Color32 types.
eframe.workspace = true

[lints]
workspace = true
