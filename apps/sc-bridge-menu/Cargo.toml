[package]
name = "sc-bridge-menu"
version = "1.11.0"
edition.workspace = true
license.workspace = true
# Not published to crates.io; distribution is GitHub releases only.
publish = false

[features]
default = ["editor", "overlay", "updater"]
editor = ["dep:eframe", "dep:ui-theme", "dep:controller-art"]
overlay = ["dep:eframe", "dep:ui-theme"]
# About, Changelog, and Updates are tabs of one window, so the former `about`
# feature no longer names anything that can be built on its own.
updater = ["dep:chrono", "dep:eframe", "dep:ui-theme", "dep:release-updater", "dep:semver"]
# The menu-side capability includes the updater UI and forwards the matching
# feature to the optional updater dependency.
local-update-source = ["updater", "release-updater?/local-update-source"]

[dependencies]
app-paths = { path = "../../crates/host/app-paths" }
bridge-runtime = { path = "../../crates/bridge/bridge-runtime" }
clap.workspace = true
desktop-bindings = { path = "../../crates/app/desktop-bindings" }
menu-shell = { path = "../../crates/host/menu-shell" }
platform-capabilities = { path = "../../crates/host/platform-capabilities" }
profile-picker = { path = "../../crates/app/profile-picker" }
release-updater = { path = "../../crates/app/release-updater", optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
steam-controller-device = { path = "../../crates/controller/steam-controller-device" }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
desktop-input = { path = "../../crates/host/desktop-input" }
virtual-gamepad = { path = "../../crates/host/virtual-gamepad" }
eframe = { workspace = true, optional = true }
ui-theme = { path = "../../crates/app/ui-theme", optional = true }
# Only the editor draws a controller; the overlay does not.
controller-art = { path = "../../crates/app/controller-art", optional = true }
tiny-skia.workspace = true
tray-icon.workspace = true
winit.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
chrono = { workspace = true, optional = true }

[lints]
workspace = true
