[package]
name = "sc-bridge-menu"
version = "1.1.0"
edition.workspace = true
license.workspace = true
# Not published to crates.io; distribution is GitHub releases only.
publish = false

[features]
default = ["editor"]
editor = ["dep:eframe"]

[dependencies]
bridge-runtime = { path = "../../crates/bridge-runtime" }
desktop-bindings = { path = "../../crates/desktop-bindings" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
steam-controller-device = { path = "../../crates/steam-controller-device" }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, optional = true }
tiny-skia.workspace = true
tray-icon.workspace = true
winit.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true

[lints]
workspace = true
