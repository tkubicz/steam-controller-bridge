[package]
name = "sc-bridge-menu"
version = "1.5.0"
edition.workspace = true
license.workspace = true
# Not published to crates.io; distribution is GitHub releases only.
publish = false

[features]
default = ["about", "editor", "overlay", "updater"]
about = ["dep:eframe", "dep:ui-theme"]
editor = ["dep:eframe", "dep:ui-theme", "dep:controller-art"]
overlay = ["dep:eframe", "dep:ui-theme"]
updater = ["dep:eframe", "dep:ui-theme", "dep:release-updater", "dep:semver"]

[dependencies]
bridge-runtime = { path = "../../crates/bridge-runtime" }
desktop-bindings = { path = "../../crates/desktop-bindings" }
profile-picker = { path = "../../crates/profile-picker" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
steam-controller-device = { path = "../../crates/steam-controller-device" }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, optional = true }
ui-theme = { path = "../../crates/ui-theme", optional = true }
# Only the editor draws a controller; the overlay does not.
controller-art = { path = "../../crates/controller-art", optional = true }
tiny-skia.workspace = true
tray-icon.workspace = true
winit.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
release-updater = { path = "../../crates/release-updater", optional = true }
semver = { workspace = true, optional = true }

[lints]
workspace = true
