[package]
name = "sc-visualizer"
version = "1.9.0"
edition.workspace = true
license.workspace = true
# Not published to crates.io; distribution is GitHub releases only.
publish = false

[dependencies]
controller-mapper = { path = "../../crates/controller-mapper" }
bridge-output = { path = "../../crates/bridge-output" }
clap.workspace = true
ctrlc.workspace = true
desktop-bindings = { path = "../../crates/desktop-bindings" }
eframe = { workspace = true, features = ["wayland", "x11"] }
gamepad-state = { path = "../../crates/gamepad-state" }
recording = { path = "../../crates/recording" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
steam-controller-discovery = { path = "../../crates/steam-controller-discovery" }
steam-controller-device = { path = "../../crates/steam-controller-device" }
steam-controller-protocol = { path = "../../crates/steam-controller-protocol" }
controller-art = { path = "../../crates/controller-art" }
ui-theme = { path = "../../crates/ui-theme" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true

[lints]
workspace = true
